<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyHaven Play</title>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <style>
    :root { --primary: #1e3a8a; --secondary: #2563eb; --card-bg: rgba(255,255,255,0.95); --text: #0f172a; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: linear-gradient(135deg, #0f172a, #1e293b); color: var(--text); padding: 12px; min-height: 100vh; }
    .container { max-width: 650px; margin: 0 auto; }
    header { background: linear-gradient(135deg, #1e3a8a, #0284c7); color: white; padding: 15px; border-radius: 14px; text-align: center; margin-bottom: 10px; }
    .utility-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .nav-tabs { display: flex; gap: 4px; margin-bottom: 10px; flex-wrap: wrap; }
    .tab-btn { flex: 1; min-width: 60px; padding: 8px 2px; border: none; background: rgba(255,255,255,0.8); border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
    .tab-btn.active { background: var(--secondary); color: white; }
    .card { background: var(--card-bg); border-radius: 14px; padding: 15px; margin-bottom: 10px; }
    .voice-btn { background: #ef4444; color: white; border: none; padding: 10px 16px; border-radius: 20px; font-weight: bold; cursor: pointer; }
    .avatar-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .avatar-card { border: 2px solid #e2e8f0; border-radius: 10px; padding: 6px; text-align: center; cursor: pointer; background: white; }
    .avatar-card.selected { border-color: var(--secondary); background: #eff6ff; }
    canvas { border: 2px dashed #cbd5e1; border-radius: 10px; width: 100%; height: 260px; background: white; touch-action: none; }
    #pacmanCanvas { background: #000; border-radius: 10px; display: block; margin: 0 auto; }
    .dpad { display: grid; grid-template-columns: repeat(3, 50px); gap: 6px; justify-content: center; margin-top: 10px; user-select: none; }
    .dpad-btn { width: 50px; height: 50px; font-size: 1.3rem; background: #334155; color: white; border: none; border-radius: 10px; cursor: pointer; touch-action: manipulation; }
    .dpad-btn:active { background: #2563eb; }
    .puzzle-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; max-width: 270px; margin: 10px auto; background: #1e293b; padding: 6px; border-radius: 10px; }
    .puzzle-tile { aspect-ratio: 1; background: var(--secondary); color: white; font-size: 1.4rem; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 6px; cursor: pointer; }
    .puzzle-tile.empty { background: transparent; cursor: default; }
    .board-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; max-width: 240px; margin: 10px auto; }
    .cell { aspect-ratio: 1; background: #f8fafc; border-radius: 8px; font-size: 1.8rem; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; }
    .board-grid-c4 { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; max-width: 300px; margin: 10px auto; background: #1e3a8a; padding: 8px; border-radius: 10px; }
    .c4-cell { aspect-ratio: 1; background: white; border-radius: 50%; cursor: pointer; }
    .c4-cell.red { background: #ef4444; }
    .c4-cell.yellow { background: #eab308; }
    .btn { padding: 8px 12px; border: none; border-radius: 6px; background: var(--secondary); color: white; font-weight: bold; cursor: pointer; font-size: 0.8rem; }
    .btn-secondary { background: #64748b; }
    .status-text { margin-bottom: 6px; font-weight: bold; color: var(--primary); text-align: center; }
    .key-btn { width: 30px; height: 34px; border: 1px solid #cbd5e1; background: white; border-radius: 4px; font-weight: bold; cursor: pointer; margin: 2px; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1 style="font-size:1.4rem;">FamilyHaven Play 🌍</h1>
    <p style="font-size:0.8rem;">Dallas 🇺🇸 St. Louis 🇺🇸 Istanbul 🇹🇷 Lebanon 🇱🇧</p>
  </header>

  <div class="utility-bar">
    <button class="btn btn-secondary" id="musicBtn" onclick="toggleMusic()">🎮 Arcade Music: OFF</button>
    <div style="font-weight:bold; color:white; font-size:0.85rem;">Room Code: <input type="text" id="roomCode" value="1234" style="width:50px; text-align:center;"></div>
  </div>

  <div class="card" style="text-align:center; padding:8px;">
    <button class="voice-btn" onmousedown="startVoiceRecording()" onmouseup="stopVoiceRecording()" ontouchstart="startVoiceRecording()" ontouchend="stopVoiceRecording()">🎤 Hold to Record Voice Note</button>
    <div id="voiceStatus" style="font-size:0.75rem; margin-top:4px;">Hold to talk, release to send</div>
    <div id="voicePlayerContainer"></div>
  </div>

  <div class="nav-tabs">
    <button class="tab-btn active" onclick="showTab('family')">Profile</button>
    <button class="tab-btn" onclick="showTab('pacman')">Pac-Man 💛</button>
    <button class="tab-btn" onclick="showTab('hangman')">Hangman 🔤</button>
    <button class="tab-btn" onclick="showTab('puzzle')">Puzzle 🧩</button>
    <button class="tab-btn" onclick="showTab('tictactoe')">Tic-Tac-Toe ❌</button>
    <button class="tab-btn" onclick="showTab('connect4')">Connect 4 🟡</button>
    <button class="tab-btn" onclick="showTab('draw')">Draw 🎨</button>
  </div>

  <div id="tab-family" class="card">
    <h3>Select Profile</h3>
    <div class="avatar-grid" style="margin-top:8px;">
      <div class="avatar-card selected" onclick="selectAvatar(this)"><span>👴</span><p>Jedo</p></div>
      <div class="avatar-card" onclick="selectAvatar(this)"><span>👵</span><p>Teta</p></div>
      <div class="avatar-card" onclick="selectAvatar(this)"><span>👩</span><p>Mama / Sara</p></div>
      <div class="avatar-card" onclick="selectAvatar
